<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 加入 viewport-fit=cover，以便完美适配刘海屏和灵动岛的顶部安全区域 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>我的计数器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            /* 加深背景色至 #E5E5EA (更深的 iOS 灰色)，凸显卡片的白色 */
            --bg: #E5E5EA;
            --card-bg: #FFFFFF;
            --text-main: #000000;
            --text-sub: #8E8E93;
            --blue: #007AFF;
            --red: #FF3B30;
            --green: #34C759;
            --orange: #FF9500;
            --border: #D1D1D6;
        }

        body {
            margin: 0; padding: 0; background-color: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
        }

        /* 顶部导航栏 (极致收窄并适配刘海屏) */
        .header {
            /* 使用 env(safe-area-inset-top) 动态获取刘海高度，而不是写死 48px */
            padding: max(env(safe-area-inset-top), 16px) 14px 8px; 
            background: var(--card-bg); font-size: 22px; font-weight: 700;
            border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10;
        }
        .header-btn { font-size: 14px; color: var(--blue); background: none; border: none; padding: 4px 0; cursor: pointer; }
        .add-btn { font-size: 22px; font-weight: 400; padding: 0; }
        .header-left { display: flex; align-items: center; gap: 10px; }

        /* 列表区域 */
        .list-container { padding: 10px 14px; padding-bottom: 100px; }
        .tip-text { text-align: center; color: var(--text-sub); font-size: 11px; margin-bottom: 10px; }

        /* 卡片设计 (终极收窄高密度) */
        .card {
            background: var(--card-bg); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06); display: flex; align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .sortable-ghost { opacity: 0.4; }
        .sortable-drag { transform: scale(1.02); box-shadow: 0 6px 16px rgba(0,0,0,0.12); z-index: 99; }

        .card-icon { font-size: 22px; margin-right: 10px; width: 28px; text-align: center; }
        .info-area { flex: 1; min-width: 0; }
        .title-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 2px; }
        .title { font-size: 15px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        .step-badge { font-size: 10px; background: var(--bg); color: var(--text-sub); padding: 1px 5px; border-radius: 4px; }

        /* 倒计时徽章 */
        .timer-badge { font-size: 10px; padding: 2px 5px; border-radius: 6px; font-weight: 600; font-variant-numeric: tabular-nums; transition: all 0.3s ease; }
        .timer-badge.idle { background: var(--bg); color: var(--text-sub); }
        .timer-badge.normal { background: #E5F0FF; color: var(--blue); }
        .timer-badge.warning { background: #FFF3E0; color: var(--orange); }
        .timer-badge.danger { background: #FFEBEA; color: var(--red); animation: shake 1s infinite; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }

        /* 进度条 */
        .progress-container { margin-top: 3px; margin-bottom: 3px; }
        .progress-text { font-size: 10px; color: var(--text-sub); margin-bottom: 2px; display: flex; justify-content: space-between; }
        .progress-track { height: 4px; background-color: var(--bg); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 2px; transition: width 0.3s ease; }

        /* 底部操作区 */
        .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 4px; }
        .btn-action { font-size: 12px; color: var(--blue); background: none; border: none; padding: 2px 0; cursor: pointer; }
        .btn-action.delete { color: var(--red); }

        .count-area { text-align: right; margin-left: 8px; }
        .count-number { font-size: 22px; font-weight: bold; color: var(--text-main); margin-bottom: 3px; font-variant-numeric: tabular-nums; }
        .tap-btn { color: white; border: none; border-radius: 10px; width: 50px; height: 38px; font-size: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .tap-btn:active { opacity: 0.7; transform: scale(0.95); transition: all 0.1s; }
        .empty-state { text-align: center; color: var(--text-sub); margin-top: 80px; font-size: 14px; }

        /* 模态框 */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 100; display: none; align-items: center; justify-content: center; }
        .modal { background: var(--card-bg); width: 90%; max-width: 360px; max-height: 90vh; overflow-y: auto; border-radius: 14px; padding: 18px; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0,0,0,0.1); animation: popIn 0.2s ease-out; }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal h3 { margin: 0 0 14px 0; text-align: center; font-size: 16px; }

        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; }
        .form-group label { font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
        .form-group input { background: var(--bg); border: 1px solid var(--border); padding: 8px 10px; border-radius: 8px; font-size: 14px; outline: none; -webkit-appearance: none; }
        .form-group input:focus { border-color: var(--blue); }
        .form-row { display: flex; gap: 8px; }
        .form-row .form-group { flex: 1; }

        /* 图标与颜色选择器网格 */
        .icon-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
        .icon-item { font-size: 20px; text-align: center; padding: 6px 0; background: var(--bg); border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
        .icon-item.selected { border-color: var(--blue); background: #E5F0FF; transform: scale(1.1); }
        .icon-item.none { font-size: 12px; color: var(--text-sub); display: flex; align-items: center; justify-content: center; }
        
        .color-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .color-item { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; box-sizing: border-box; transition: transform 0.2s; }
        .color-item.selected { transform: scale(1.15); box-shadow: 0 0 0 2px var(--card-bg), 0 0 0 4px var(--text-sub); }

        .modal-btns { display: flex; gap: 10px; margin-top: 14px; }
        .modal-btn { flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; border: none; font-weight: 600; }
        .modal-btn.cancel { background: var(--bg); color: var(--text-main); }
        .modal-btn.save { background: var(--blue); color: white; }

        /* 统计面板增强样式 */
        .stats-summary-box { background: var(--bg); border-radius: 10px; padding: 14px; margin-bottom: 16px; }
        .stats-grand-total { font-size: 14px; color: var(--text-sub); text-align: center; margin-bottom: 10px; }
        .stats-grand-total span { font-size: 26px; font-weight: bold; color: var(--text-main); display: block; margin-top: 2px; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .stats-card { background: var(--card-bg); padding: 8px 10px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
        .stats-name-col { display: flex; align-items: center; gap: 4px; font-size: 12px; overflow: hidden; }
        .stats-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stats-total { font-weight: bold; font-size: 14px; }

        .section-title { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; font-weight: 600; }

        /* 统计历史列表项 */
        .stat-item { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
        .stat-item:last-child { border-bottom: none; }
        .stat-icon { font-size: 18px; margin-right: 8px; width: 24px; text-align: center; }
        .stat-info { flex: 1; }
        .stat-title { font-weight: 600; font-size: 13px; margin-bottom: 2px; color: var(--text-main); }
        .stat-time { font-size: 10px; color: var(--text-sub); }
        .stat-target { font-weight: bold; font-size: 15px; }
        .stats-empty { text-align: center; color: var(--text-sub); padding: 30px 0; font-size: 13px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <span>计数器</span>
            <button class="header-btn" onclick="openStats()">统计</button>
        </div>
        <button class="header-btn add-btn" onclick="openModal()">＋</button>
    </div>

    <div class="tip-text" id="drag-tip" style="display: none;">💡 长按卡片可自由拖拽排序</div>

    <div class="list-container" id="counter-list">
        <!-- 动态生成 -->
    </div>

    <!-- 添加/编辑 弹窗 -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h3 id="modal-title">添加计数器</h3>
            <input type="hidden" id="m-id">
            
            <div class="form-group">
                <label>选择主题颜色</label>
                <div class="color-grid" id="color-grid"></div>
            </div>

            <div class="form-group">
                <label>选择图标 (水果 & 运动)</label>
                <div class="icon-grid" id="icon-grid"></div>
            </div>

            <div class="form-group">
                <label>名称*</label>
                <input type="text" id="m-name" placeholder="如：吃苹果、俯卧撑">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>每次步长</label>
                    <input type="number" id="m-step" placeholder="1" value="1">
                </div>
                <div class="form-group">
                    <label>目标值(可选)</label>
                    <input type="number" id="m-target" placeholder="无目标">
                </div>
            </div>

            <div class="form-group">
                <label>倒计时提醒 (分钟) - 留空不提醒</label>
                <input type="number" id="m-timer" placeholder="如：5 代表5分钟内需+1">
            </div>

            <div class="modal-btns">
                <button class="modal-btn cancel" onclick="closeModal()">取消</button>
                <button class="modal-btn save" onclick="saveModal()">保存</button>
            </div>
        </div>
    </div>

    <!-- 统计 弹窗 -->
    <div class="modal-overlay" id="stats-overlay">
        <div class="modal" style="width: 95%; max-width: 400px; padding: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <button class="btn-action delete" onclick="clearStats()">清空记录</button>
                <h3 style="margin: 0; font-size: 16px;">数据统计</h3>
                <button class="btn-action" onclick="closeStats()" style="font-weight: 600;">关闭</button>
            </div>
            
            <div style="max-height: 70vh; overflow-y: auto; padding-bottom: 10px;">
                <div id="stats-summary-container">
                    <!-- 汇总数据由 JS 动态生成 -->
                </div>
                
                <div class="section-title">达成历史记录</div>
                <div id="stats-list">
                    <!-- 历史列表由 JS 动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // 更新了 Emoji 列表，23个水果/运动 + 1个“无” = 24个完美铺满4行
        const EMOJI_LIST = [
            '🍎','🍐','🍊','🍋','🍌','🍉',
            '🍇','🍓','🍈','🍒','🍑','🍍',
            '🥥','🥝','🍅','🥑','⚽️','🏀',
            '🎾','🏓','🏸','🏊','🚴','🏃'
        ];
        const COLOR_LIST = ['#007AFF', '#34C759', '#FF9500', '#FF3B30', '#AF52DE', '#FF2D55', '#5AC8FA', '#8E8E93'];
        
        let currentSelectedIcon = '';
        let currentSelectedColor = COLOR_LIST[0];

        let counters = JSON.parse(localStorage.getItem('my_multi_counters')) || [];
        counters = counters.map(c => ({
            ...c, step: c.step || 1, target: c.target || null, icon: c.icon || '',
            color: c.color || COLOR_LIST[0], timerMinutes: c.timerMinutes || 0, lastUpdated: c.lastUpdated || 0
        }));

        const listContainer = document.getElementById('counter-list');
        const modalOverlay = document.getElementById('modal-overlay');
        const dragTip = document.getElementById('drag-tip');
        const statsOverlay = document.getElementById('stats-overlay');

        function renderEmojiGrid() {
            const grid = document.getElementById('icon-grid');
            let html = EMOJI_LIST.map(emoji => `
                <div class="icon-item ${currentSelectedIcon === emoji ? 'selected' : ''}" 
                     onclick="selectIcon('${emoji}')">${emoji}</div>
            `).join('');
            html += `<div class="icon-item none ${currentSelectedIcon === '' ? 'selected' : ''}" 
                          onclick="selectIcon('')">无</div>`;
            grid.innerHTML = html;
        }

        function renderColorGrid() {
            const grid = document.getElementById('color-grid');
            grid.innerHTML = COLOR_LIST.map(c => `
                <div class="color-item ${currentSelectedColor === c ? 'selected' : ''}" 
                     style="background-color: ${c};"
                     onclick="selectColor('${c}')"></div>
            `).join('');
        }

        function selectIcon(emoji) { currentSelectedIcon = emoji; renderEmojiGrid(); }
        function selectColor(c) { currentSelectedColor = c; renderColorGrid(); }

        let sortableInstance = null;

        function saveAndRender(skipRender = false) {
            localStorage.setItem('my_multi_counters', JSON.stringify(counters));
            if (!skipRender) { render(); updateTimers(); }
        }

        function render() {
            if (counters.length === 0) {
                dragTip.style.display = 'none';
                listContainer.innerHTML = '<div class="empty-state">暂无计数器<br><br>点击右上角 ＋ 添加</div>';
                return;
            }

            dragTip.style.display = counters.length > 1 ? 'block' : 'none';

            listContainer.innerHTML = counters.map((c) => {
                let progressHtml = '';
                if (c.target && c.target > 0) {
                    const percent = Math.min((c.count / c.target) * 100, 100);
                    progressHtml = `
                        <div class="progress-container">
                            <div class="progress-text">
                                <span>进度</span>
                                <span>${c.count} / ${c.target}</span>
                            </div>
                            <div class="progress-track">
                                <div class="progress-fill" style="width: ${percent}%; background-color: ${c.color}"></div>
                            </div>
                        </div>
                    `;
                }

                const timerHtml = c.timerMinutes > 0 
                    ? `<span id="timer-${c.id}" class="timer-badge idle">待点击</span>` : '';
                const iconHtml = c.icon ? `<div class="card-icon">${c.icon}</div>` : '';

                return `
                <div class="card" data-id="${c.id}">
                    ${iconHtml}
                    <div class="info-area">
                        <div class="title-row">
                            <div class="title">${c.name}</div>
                            ${c.step !== 1 ? `<div class="step-badge">+${c.step}</div>` : ''}
                            ${timerHtml}
                        </div>
                        ${progressHtml}
                        <div class="actions">
                            <button class="btn-action" onclick="openModal(${c.id})">设置</button>
                            <button class="btn-action" onclick="resetCounter(${c.id})">清零</button>
                            <button class="btn-action delete" onclick="deleteCounter(${c.id})">删除</button>
                        </div>
                    </div>
                    
                    <div class="count-area">
                        <div class="count-number">${c.count}</div>
                        <button class="tap-btn" style="background-color: ${c.color}" onclick="increment(${c.id})">＋</button>
                    </div>
                </div>
                `;
            }).join('');

            initSortable();
        }

        function initSortable() {
            if (sortableInstance) sortableInstance.destroy();
            if (typeof Sortable !== 'undefined') {
                sortableInstance = new Sortable(listContainer, {
                    animation: 150, delay: 200, delayOnTouchOnly: true,
                    ghostClass: 'sortable-ghost', dragClass: 'sortable-drag',
                    onEnd: function (evt) {
                        const oldIndex = evt.oldIndex; const newIndex = evt.newIndex;
                        if (oldIndex !== newIndex) {
                            const movedItem = counters.splice(oldIndex, 1)[0];
                            counters.splice(newIndex, 0, movedItem);
                            saveAndRender(true);
                        }
                    }
                });
            }
        }

        // ---------- 倒计时逻辑 ----------
        function formatTime(ms) {
            const totalSec = Math.floor(ms / 1000);
            const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
            const s = (totalSec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateTimers() {
            const now = Date.now();
            counters.forEach(c => {
                if (!c.timerMinutes) return;
                const el = document.getElementById(`timer-${c.id}`);
                if (!el) return;

                if (!c.lastUpdated) {
                    el.innerText = '待点击'; el.className = 'timer-badge idle'; return;
                }

                const elapsed = now - c.lastUpdated;
                const limitMs = c.timerMinutes * 60 * 1000;
                const remainMs = limitMs - elapsed;

                if (remainMs <= 0) {
                    el.innerText = '已超时'; el.className = 'timer-badge danger';
                } else if (remainMs <= 60000) { 
                    el.innerText = formatTime(remainMs); el.className = 'timer-badge warning';
                } else {
                    el.innerText = formatTime(remainMs); el.className = 'timer-badge normal';
                }
            });
        }
        setInterval(updateTimers, 1000);

        // ---------- 弹窗逻辑 ----------
        function openModal(id = null) {
            document.getElementById('m-id').value = id || '';
            if (id) {
                const c = counters.find(x => x.id === id);
                document.getElementById('modal-title').innerText = '编辑设置';
                document.getElementById('m-name').value = c.name;
                currentSelectedIcon = c.icon || '';
                currentSelectedColor = c.color || COLOR_LIST[0];
                document.getElementById('m-step').value = c.step;
                document.getElementById('m-target').value = c.target || '';
                document.getElementById('m-timer').value = c.timerMinutes || '';
            } else {
                document.getElementById('modal-title').innerText = '添加计数器';
                document.getElementById('m-name').value = '';
                currentSelectedIcon = '';
                currentSelectedColor = COLOR_LIST[0];
                document.getElementById('m-step').value = '1';
                document.getElementById('m-target').value = '';
                document.getElementById('m-timer').value = '';
            }
            renderEmojiGrid(); renderColorGrid();
            modalOverlay.style.display = 'flex';
        }

        function closeModal() { modalOverlay.style.display = 'none'; }

        function saveModal() {
            const id = document.getElementById('m-id').value;
            const name = document.getElementById('m-name').value.trim();
            const step = parseInt(document.getElementById('m-step').value) || 1;
            const targetVal = document.getElementById('m-target').value;
            const target = targetVal ? parseInt(targetVal) : null;
            const timerVal = document.getElementById('m-timer').value;
            const timerMinutes = timerVal ? parseFloat(timerVal) : 0;

            if (!name) return alert("请输入名称");

            if (id) {
                const index = counters.findIndex(c => c.id == id);
                if (index !== -1) {
                    counters[index].name = name; counters[index].icon = currentSelectedIcon;
                    counters[index].color = currentSelectedColor; counters[index].step = step;
                    counters[index].target = target; counters[index].timerMinutes = timerMinutes;
                }
            } else {
                counters.push({
                    id: Date.now(), name, icon: currentSelectedIcon, color: currentSelectedColor,
                    step, target, count: 0, timerMinutes, lastUpdated: 0
                });
            }
            saveAndRender(); closeModal();
        }

        function increment(id) {
            const index = counters.findIndex(c => c.id === id);
            if (index !== -1) {
                counters[index].count += counters[index].step;
                counters[index].lastUpdated = Date.now();
                saveAndRender();

                if (counters[index].target && counters[index].count >= counters[index].target) {
                    setTimeout(() => {
                        const history = JSON.parse(localStorage.getItem('my_counters_history')) || [];
                        history.unshift({
                            id: Date.now(), counterId: counters[index].id, name: counters[index].name,
                            icon: counters[index].icon, color: counters[index].color, target: counters[index].target, time: Date.now()
                        });
                        localStorage.setItem('my_counters_history', JSON.stringify(history));

                        alert(`🎉 恭喜！【${counters[index].name}】已达成目标（${counters[index].target}）！\n进度已自动记录并清零。`);
                        counters[index].count = 0; counters[index].lastUpdated = 0; saveAndRender();
                    }, 50);
                }
            }
        }

        function resetCounter(id) {
            const index = counters.findIndex(c => c.id === id);
            if (index !== -1) {
                if (confirm(`确定要将【${counters[index].name}】清零吗？`)) {
                    counters[index].count = 0; counters[index].lastUpdated = 0; saveAndRender();
                }
            }
        }

        function deleteCounter(id) {
            if (confirm(`删除后不可恢复，确定要删除吗？`)) {
                counters = counters.filter(c => c.id !== id); saveAndRender();
            }
        }

        // ---------- 统计面板逻辑 ----------
        function openStats() {
            const history = JSON.parse(localStorage.getItem('my_counters_history')) || [];
            let grandTotal = 0;
            const statsMap = {}; 
            
            history.forEach(item => {
                grandTotal += item.target;
                const key = item.name;
                if (!statsMap[key]) statsMap[key] = { icon: item.icon, color: item.color, total: 0 };
                statsMap[key].total += item.target;
            });
            
            counters.forEach(c => {
                grandTotal += c.count;
                const key = c.name;
                if (!statsMap[key]) statsMap[key] = { icon: c.icon, color: c.color, total: 0 };
                statsMap[key].total += c.count;
            });

            const summaryEl = document.getElementById('stats-summary-container');
            if (grandTotal === 0) {
                summaryEl.innerHTML = '<div class="stats-empty" style="padding: 10px 0;">暂无任何累计数据</div>';
            } else {
                const sortedKeys = Object.keys(statsMap).sort((a,b) => statsMap[b].total - statsMap[a].total);
                const cardsHtml = sortedKeys.map(k => {
                    const s = statsMap[k];
                    const iconHtml = s.icon ? `<span style="font-size: 14px;">${s.icon}</span>` : '';
                    return `
                        <div class="stats-card">
                            <div class="stats-name-col">${iconHtml}<span class="stats-name">${k}</span></div>
                            <div class="stats-total" style="color: ${s.color}">${s.total}</div>
                        </div>
                    `;
                }).join('');
                
                summaryEl.innerHTML = `
                    <div class="stats-summary-box">
                        <div class="stats-grand-total">累计点击总数<span>${grandTotal}</span></div>
                        <div class="section-title">各项目总计分布</div>
                        <div class="stats-grid">
                            ${cardsHtml}
                        </div>
                    </div>
                `;
            }

            const listEl = document.getElementById('stats-list');
            if (history.length === 0) {
                listEl.innerHTML = '<div class="stats-empty" style="padding: 20px 0;">暂无达成历史</div>';
            } else {
                listEl.innerHTML = history.map(item => {
                    const date = new Date(item.time);
                    const timeStr = `${date.getMonth()+1}月${date.getDate()}日 ${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
                    const iconHtml = item.icon ? `<div class="stat-icon">${item.icon}</div>` : '';
                    return `
                        <div class="stat-item">
                            ${iconHtml}
                            <div class="stat-info">
                                <div class="stat-title">${item.name}</div>
                                <div class="stat-time">${timeStr}</div>
                            </div>
                            <div class="stat-target" style="color: ${item.color || 'var(--blue)'}">
                                +${item.target}
                            </div>
                        </div>
                    `;
                }).join('');
            }
            
            statsOverlay.style.display = 'flex';
        }

        function closeStats() { statsOverlay.style.display = 'none'; }

        function clearStats() {
            const history = JSON.parse(localStorage.getItem('my_counters_history')) || [];
            if (history.length === 0) return;
            if (confirm("确定要清空所有达成历史记录吗？（当前面板的活跃计数不会被清零）")) {
                localStorage.setItem('my_counters_history', JSON.stringify([]));
                openStats(); 
            }
        }

        render();
        updateTimers();
    </script>
</body>
</html>
